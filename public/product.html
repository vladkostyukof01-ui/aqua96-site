<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Товар — Аква 96</title>
<meta name="description" id="pageDescription" content="Оборудование для бассейнов, саун и турецких бань.">
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="navPlaceholder"></div>

<main>
  <div class="wrap breadcrumbs">
    <a href="/">Главная</a> / <a id="breadcrumbCategory" href="/"></a> / <span id="breadcrumbCurrent"></span>
  </div>

  <section class="wrap product-detail" id="productDetail" hidden>
    <div class="product-detail-media" id="productMedia"></div>
    <div class="product-detail-body">
      <span class="product-detail-brand" id="productBrand"></span>
      <h1 id="productTitle"></h1>
      <p class="product-detail-desc" id="productDescription"></p>
      <div class="product-detail-price" id="productPrice"></div>
      <ul class="product-specs" id="productSimpleSpecs"></ul>
      <a href="/kontakty" class="btn btn-accent" style="width:100%; justify-content:center;">Оставить заявку на этот товар</a>
    </div>
  </section>

  <section class="wrap product-variants-section" id="productVariantsSection" hidden>
    <h2>Варианты исполнения</h2>
    <div class="variants-table-wrap">
      <table class="variants-table" id="variantsTable"></table>
    </div>
  </section>

  <section class="wrap" id="notFoundSection" hidden>
    <p style="padding:60px 0;">Товар не найден. <a href="/">Вернуться на главную →</a></p>
  </section>
</main>

<div id="footerPlaceholder"></div>

<script src="/common.js"></script>
<script>
function productIdFromPath() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1];
}

function parseOneSpecsTable(rawLines) {
  // rawLines — строки одной таблицы (уже без пустых/мусорных строк).
  // Ячейки заголовка с переносом строки в оригинальной HTML-таблице
  // (напр. "Размер" + "H,мм" двумя <p> в одной <th>) при построчном сборе
  // текста разошлись на несколько строк — они логически образуют ОДНУ
  // строку заголовка. Строки данных всегда содержат одно и то же число
  // колонок (равное числу колонок последней строки), поэтому склеиваем
  // в заголовок все ведущие строки меньшей ширины, до первой строки,
  // которая уже соответствует этому количеству.
  if (!rawLines.length) return null;
  const dataColumnCount = rawLines[rawLines.length - 1].split('|').length;
  const mergedLines = [];
  let buffer = '';
  let inHeader = true;
  rawLines.forEach(line => {
    const cellCount = line.split('|').length;
    if (inHeader && cellCount === dataColumnCount) {
      if (buffer) { mergedLines.push(buffer); buffer = ''; }
      inHeader = false;
      mergedLines.push(line);
    } else if (inHeader) {
      buffer = buffer ? buffer + ' ' + line.trim() : line;
    } else {
      mergedLines.push(line);
    }
  });
  if (buffer) mergedLines.push(buffer);

  return mergedLines.map(l => l.split('|').map(c => c.trim()));
}

function stripCommonPrefix(bodyRows) {
  // Название модели в первой колонке часто повторяет полное имя товара
  // ("HARVIA Электрическая печь Vega HCB600400S ВС60", "...HCB800400S ВС80"),
  // отчего колонка становится непропорционально широкой. Если у всех строк
  // общий словесный префикс длиннее одного слова — обрезаем его, оставляя
  // только уникальную часть (модель/артикул).
  if (bodyRows.length < 2) return bodyRows;
  const firstCol = bodyRows.map(r => r[0]);
  const wordsPerRow = firstCol.map(v => v.split(' '));
  let commonWords = 0;
  const minWords = Math.min(...wordsPerRow.map(w => w.length));
  while (commonWords < minWords - 1) {
    const word = wordsPerRow[0][commonWords];
    if (wordsPerRow.every(w => w[commonWords] === word)) commonWords++;
    else break;
  }
  if (commonWords < 2) return bodyRows;
  return bodyRows.map((r, i) => [wordsPerRow[i].slice(commonWords).join(' '), ...r.slice(1)]);
}

function abbreviateHeader(h) {
  // В широких таблицах вариантов (11+ колонок, напр. Фильтр IML) заголовки
  // вида "Площадь фильтрации,м2" при переносе по буквам на узкой колонке
  // становятся нечитаемыми ("ПЛО/ЩАДЬ/ФИЛ/ЬТР..."). Сокращаем частые длинные
  // слова до принятых аббревиатур; полный текст остаётся в title-атрибуте
  // (проставляется в вызывающем коде), так что при наведении видно оригинал.
  return h
    .replace(/Площадь фильтрации/i, 'Площадь фильтр.')
    .replace(/Производительность/i, 'Произв-ть')
    .replace(/Диаметр/i, 'Диам.')
    .replace(/Патрубок/i, 'Патруб.')
    .replace(/Артикул/i, 'Арт.')
    .replace(/Фильтрат/i, 'Фильтрат');
}

function extractSimpleSpecs(specs) {
  // Ищет среди блоков specs 2-колоночную key-value таблицу общих
  // характеристик (напр. "Производитель | HARVIA") — она НЕ является
  // таблицей вариантов (та шире) и показывается отдельным списком.
  const blocks = specs.split(/\n\s*\n/).map(block =>
    block.split('\n')
      .filter(l => l.includes('|'))
      .filter(l => l.split('|').some(c => c.trim()))
  ).filter(lines => lines.length);
  const twoColBlock = blocks.find(lines => lines.every(l => l.split('|').length === 2));
  if (!twoColBlock) return [];
  return twoColBlock.map(l => l.split('|').map(c => c.trim()));
}

function parseSpecsTable(specs) {
  // specs может содержать НЕСКОЛЬКО отдельных таблиц исходного сайта,
  // разделённых пустой строкой. Два случая:
  // 1) Простая key-value таблица общих характеристик ("Производитель |
  //    HARVIA") ИДЁТ ПЕРЕД настоящей таблицей вариантов ("Модель | Мощность
  //    | ... | Цена") — у них разная ширина заголовка. В этом случае нужна
  //    именно таблица вариантов (с наибольшим числом строк данных), а не
  //    первая попавшаяся.
  // 2) Несколько таблиц с ОДИНАКОВОЙ шириной заголовка — это варианты
  //    одного и того же товара, показанные отдельными таблицами на сайте
  //    (напр. по артикулу) — объединяем их строки данных под одним
  //    заголовком.
  const blocks = specs.split(/\n\s*\n/).map(block =>
    block.split('\n')
      .filter(l => l.includes('|'))
      .filter(l => l.split('|').some(c => c.trim()))
  ).filter(lines => lines.length);

  const parsedBlocks = blocks.map(parseOneSpecsTable).filter(Boolean);
  if (!parsedBlocks.length) return null;
  if (parsedBlocks.length === 1) {
    // Единственный блок specs. Если это простая 2-колоночная key-value
    // таблица общих характеристик (без реальных вариантов исполнения),
    // extractSimpleSpecs уже показывает его же содержимое списком под
    // ценой — повторять его отдельной таблицей "Варианты исполнения"
    // ниже было бы чистым дублированием. Такую таблицу не возвращаем.
    const only = parsedBlocks[0];
    const isSimpleTwoColumn = only.every(row => row.length === 2);
    if (isSimpleTwoColumn) return null;
    return only;
  }

  // Группируем блоки по ширине заголовка. Простая key-value сводка
  // характеристик ("Производитель | HARVIA") всегда имеет 2 колонки —
  // настоящая таблица вариантов (с моделями/артикулами/ценами) шире.
  // Поэтому среди групп с шириной > 2 берём ту, что встречается чаще
  // (несколько таблиц одинаковой широкой формы — варианты одного товара
  // на разных артикулах); если такой нет, берём просто самую широкую.
  const groups = new Map();
  parsedBlocks.forEach(block => {
    const width = block[0].length;
    if (!groups.has(width)) groups.set(width, []);
    groups.get(width).push(block);
  });
  const wideWidths = [...groups.keys()].filter(w => w > 2);
  const candidateWidths = wideWidths.length ? wideWidths : [...groups.keys()];
  let bestWidth = candidateWidths[0];
  let bestScore = -1;
  candidateWidths.forEach(width => {
    const blocksOfWidth = groups.get(width);
    const score = blocksOfWidth.length * 1000 + width; // больше таблиц этой ширины важнее, шире — вторично
    if (score > bestScore) { bestScore = score; bestWidth = width; }
  });
  const chosen = groups.get(bestWidth);
  const [firstHeader, ...firstRows] = chosen[0];
  let allRows = firstRows;
  for (let i = 1; i < chosen.length; i++) {
    const [, ...rows] = chosen[i];
    allRows = allRows.concat(rows);
  }
  return [firstHeader, ...allRows];
}

async function loadProduct() {
  const id = productIdFromPath();
  try {
    const res = await fetch('/api/products/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('not found');
    const p = await res.json();

    setText('pageTitle', p.title + ' — Аква 96');
    setText('breadcrumbCurrent', p.title);
    const catLink = document.getElementById('breadcrumbCategory');
    catLink.href = '/' + p.category_slug;
    catLink.textContent = p.category_title;

    setText('productTitle', p.title);
    if (p.brand) setText('productBrand', p.brand);
    if (p.description) setText('productDescription', p.description);
    if (p.price) setText('productPrice', p.price);

    const media = document.getElementById('productMedia');
    media.innerHTML = p.image
      ? `<img src="${escAttr(p.image)}" alt="${escAttr(p.title)}">`
      : '<span class="product-card-noimg">Фото по запросу</span>';

    const isTable = p.specs && p.specs.includes('|');
    if (p.specs && !isTable) {
      document.getElementById('productSimpleSpecs').innerHTML = p.specs.split('\n').filter(Boolean).map(line => `<li>${esc(line)}</li>`).join('');
    } else if (isTable) {
      // Если среди табличных блоков есть отдельная 2-колоночная key-value
      // сводка общих характеристик (не вариантов) — показываем её тоже,
      // отдельно от таблицы вариантов ниже.
      const simple = extractSimpleSpecs(p.specs);
      if (simple.length) {
        document.getElementById('productSimpleSpecs').innerHTML = simple.map(([k, v]) => `<li>${esc(k)}: ${esc(v)}</li>`).join('');
      }
    }

    document.getElementById('productDetail').hidden = false;

    if (isTable) {
      const rows = parseSpecsTable(p.specs);
      if (rows && rows.length > 1) {
        const thead = rows[0];
        const bodyRows = stripCommonPrefix(rows.slice(1));
        const table = document.getElementById('variantsTable');
        const isWide = thead.length >= 9;
        const wideClass = thead.length >= 9 ? ' variants-table--wide' : '';
        table.className = 'variants-table' + wideClass;
        table.innerHTML = `
          <thead><tr>${thead.map(h => {
            const full = h;
            const display = isWide ? abbreviateHeader(h) : h;
            return `<th title="${escAttr(full)}"><span>${esc(display)}</span></th>`;
          }).join('')}</tr></thead>
          <tbody>${bodyRows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        `;
        document.getElementById('productVariantsSection').hidden = false;
      }
    }
  } catch (err) {
    document.getElementById('notFoundSection').hidden = false;
    console.error('Не удалось загрузить товар:', err);
  }
}
loadProduct();
</script>
</body>
</html>
